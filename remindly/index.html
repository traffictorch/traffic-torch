  <!-- ===== REMINDLY CALENDAR ENGINE (inline) ===== -->
  <script>
    (function() {
      "use strict";

      // -------- DATA LAYER (localStorage) --------
      const STORAGE_KEY = 'remindly_events';
      let events = [];
      let currentDate = new Date();

      function loadEvents() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try { events = JSON.parse(stored); } catch(e) { events = []; }
        } else {
          // Seed demo events
          const today = new Date();
          const y = today.getFullYear(), m = today.getMonth();
          events = [
            { id: 'e1', title: 'Mom\'s Birthday', date: new Date(y, m, 12, 8, 0).getTime(), alerts: [-10080, -1440, -60], shared: true },
            { id: 'e2', title: 'Team Standup', date: new Date(y, m, 5, 10, 0).getTime(), alerts: [-1440, -60], shared: false },
            { id: 'e3', title: 'Dinner with Sarah', date: new Date(y, m, 18, 19, 0).getTime(), alerts: [-60], shared: false },
            { id: 'e4', title: 'Family BBQ', date: new Date(y, m+1, 2, 14, 0).getTime(), alerts: [-10080, -1440, -60], shared: true },
            { id: 'e5', title: 'Dentist Appointment', date: new Date(y, m, 8, 9, 30).getTime(), alerts: [-1440], shared: false },
          ];
          saveEvents();
        }
        events = events.map(e => ({ ...e, alerts: e.alerts || [] }));
      }

      function saveEvents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      }

      function addEvent(title, date, alerts = [-60], shared = false) {
        events.push({
          id: 'e' + Date.now(),
          title,
          date: date.getTime(),
          alerts,
          shared
        });
        saveEvents();
        renderAll();
      }

      // -------- RENDER FUNCTIONS --------
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const daysShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        if (!grid) return;
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const today = new Date();

        document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;

        let html = '';
        for (let i = 0; i < 7; i++) {
          html += `<div class="weekday-label">${daysShort[i]}</div>`;
        }

        const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        for (let i = 0; i < totalCells; i++) {
          const day = i - firstDay + 1;
          const isOtherMonth = day < 1 || day > daysInMonth;
          const dateObj = new Date(year, month, day);
          const isToday = !isOtherMonth && dateObj.toDateString() === today.toDateString();

          const dayEvents = events.filter(e => {
            const d = new Date(e.date);
            return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
          });

          html += `<div class="day-cell${isOtherMonth ? ' other-month' : ''}${isToday ? ' today' : ''}">`;
          html += `<span class="day-number">${isOtherMonth ? '' : day}</span>`;
          if (!isOtherMonth) {
            dayEvents.slice(0, 3).forEach(e => {
              const dotClass = e.alerts && e.alerts.length > 2 ? 'event-dot alert-chain' : 'event-dot';
              html += `<span class="${dotClass}"></span>`;
            });
            if (dayEvents.length > 3) {
              html += `<span style="font-size:0.6rem; color:#6b7280;">+${dayEvents.length-3}</span>`;
            }
            if (dayEvents.length > 0) {
              html += `<div class="event-label">${dayEvents[0].title}</div>`;
            }
          }
          html += `</div>`;
        }
        grid.innerHTML = html;

        const todayEvents = events.filter(e => {
          const d = new Date(e.date);
          return d.toDateString() === today.toDateString();
        });
        const countEl = document.getElementById('eventCountToday');
        if (countEl) countEl.textContent = todayEvents.length;

        renderUpcoming();
      }

      function renderUpcoming() {
        const list = document.getElementById('upcomingList');
        if (!list) return;
        const now = Date.now();
        const upcoming = events.filter(e => e.date > now).sort((a,b) => a.date - b.date).slice(0, 5);
        if (upcoming.length === 0) {
          list.innerHTML = `<div class="upcoming-item"><span class="title">No upcoming events</span></div>`;
          return;
        }
        list.innerHTML = upcoming.map(e => {
          const d = new Date(e.date);
          const timeStr = d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          return `<div class="upcoming-item"><span class="title">${e.title}</span><span class="time">${timeStr}</span></div>`;
        }).join('');
      }

      // -------- GAMIFICATION --------
      let streak = parseInt(localStorage.getItem('remindly_streak')) || 0;
      let xp = parseInt(localStorage.getItem('remindly_xp')) || 0;

      function updateGamification() {
        const streakEl = document.getElementById('streakCount');
        const xpEl = document.getElementById('xpDisplay');
        const levelEl = document.getElementById('levelDisplay');
        if (streakEl) streakEl.textContent = streak;
        if (xpEl) xpEl.textContent = xp;
        if (levelEl) levelEl.textContent = Math.floor(xp / 100) + 1;
      }

      function addXP(amount) {
        xp += amount;
        localStorage.setItem('remindly_xp', xp);
        streak++;
        localStorage.setItem('remindly_streak', streak);
        updateGamification();
      }

      // -------- MODAL LOGIC --------
      const modal = document.getElementById('eventModal');
      const addBtn = document.getElementById('addEventBtn');
      const cancelBtn = document.getElementById('modalCancel');
      const saveBtn = document.getElementById('modalSave');
      const eventInput = document.getElementById('eventInput');
      const aiPreview = document.getElementById('aiPreview');
      const alertButtons = document.querySelectorAll('.alert-chain-presets button');
      let selectedAlerts = [-10080, -1440, -60];

      function parseNaturalLanguage(text) {
        let title = text.trim();
        let date = new Date();
        if (text.toLowerCase().includes('tomorrow')) {
          date.setDate(date.getDate() + 1);
        } else if (text.toLowerCase().includes('next')) {
          date.setDate(date.getDate() + 7);
        }
        const monthMatch = text.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\s*(\d{1,2})/i);
        if (monthMatch) {
          const monthMap = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
          const m = monthMap[monthMatch[1].toLowerCase()];
          if (m !== undefined) {
            date.setMonth(m);
            date.setDate(parseInt(monthMatch[2]));
          }
        }
        const timeMatch = text.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
        if (timeMatch) {
          let hour = parseInt(timeMatch[1]);
          const min = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
          const mer = timeMatch[3].toLowerCase();
          if (mer === 'pm' && hour < 12) hour += 12;
          if (mer === 'am' && hour === 12) hour = 0;
          date.setHours(hour, min, 0, 0);
        } else {
          date.setHours(12, 0, 0, 0);
        }
        const cleaned = text.replace(/\b(tomorrow|next|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{1,2}(:\d{2})?\s*(am|pm))/gi, '').trim();
        return { title: cleaned || 'Untitled', date };
      }

      if (eventInput) {
        eventInput.addEventListener('input', function() {
          const parsed = parseNaturalLanguage(this.value);
          const d = parsed.date;
          const preview = `${parsed.title} · ${d.toLocaleDateString()} · ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
          if (aiPreview) aiPreview.textContent = preview;
        });
        setTimeout(() => eventInput.dispatchEvent(new Event('input')), 50);
      }

      alertButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          alertButtons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          selectedAlerts = this.dataset.offsets.split(',').map(Number);
        });
      });

      function openModal() { if (modal) modal.classList.remove('hidden'); if (eventInput) eventInput.focus(); }
      function closeModal() { if (modal) modal.classList.add('hidden'); }

      if (addBtn) addBtn.addEventListener('click', openModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === this) closeModal();
        });
      }

      if (saveBtn) {
        saveBtn.addEventListener('click', function() {
          if (!eventInput) return;
          const text = eventInput.value.trim();
          if (!text) { alert('Please enter a reminder'); return; }
          const parsed = parseNaturalLanguage(text);
          const shared = document.getElementById('shareWithFamily')?.checked || document.getElementById('inviteFriends')?.checked;
          addEvent(parsed.title, parsed.date, selectedAlerts, shared || false);
          addXP(10);
          closeModal();
          eventInput.value = '';
          document.querySelector('.alert-chain-presets .active')?.classList.remove('active');
          document.querySelector('.alert-chain-presets button')?.classList.add('active');
          selectedAlerts = [-10080, -1440, -60];
          eventInput.dispatchEvent(new Event('input'));
        });
      }

      // -------- NAVIGATION --------
      function navigateMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
      }

      const prevBtn = document.getElementById('prevMonth');
      const nextBtn = document.getElementById('nextMonth');
      const todayBtn = document.getElementById('todayBtn');
      if (prevBtn) prevBtn.addEventListener('click', () => navigateMonth(-1));
      if (nextBtn) nextBtn.addEventListener('click', () => navigateMonth(1));
      if (todayBtn) todayBtn.addEventListener('click', function() {
        currentDate = new Date();
        renderCalendar();
      });

      // -------- RESET DEMO --------
      const resetBtn = document.getElementById('resetDemoBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          if (confirm('Reset all demo events?')) {
            localStorage.removeItem(STORAGE_KEY);
            events = [];
            loadEvents();
            renderAll();
            streak = 0; xp = 0;
            localStorage.setItem('remindly_streak', '0');
            localStorage.setItem('remindly_xp', '0');
            updateGamification();
          }
        });
      }

      // -------- RENDER ALL --------
      function renderAll() {
        renderCalendar();
        updateGamification();
      }

      // -------- INIT --------
      loadEvents();
      renderAll();

      // keyboard shortcut: 'n' for new event
      document.addEventListener('keydown', function(e) {
        if (e.key === 'n' && !e.ctrlKey && !e.metaKey && modal?.classList.contains('hidden') !== false) {
          e.preventDefault();
          openModal();
        }
        if (e.key === 'Escape') closeModal();
      });

    })();
  </script>

</body>
</html>
