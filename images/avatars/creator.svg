<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgCr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glowCr" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgCr)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glowCr)"/>

  <!-- Play button triangle inside a rounded square (video/content) -->
  <rect x="90" y="110" width="220" height="180" rx="24" fill="#ffffff" opacity="0.95"/>
  <path d="M 175 160 L 175 240 L 245 200 Z" fill="#ef4444"/>

  <!-- Small pen/accent under (writing) -->
  <line x1="130" y1="320" x2="270" y2="320" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="290" cy="320" r="6" fill="#f59e0b"/>
</svg>
