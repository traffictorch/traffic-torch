<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glowD" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgD)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glowD)"/>

  <!-- Clapperboard -->
  <rect x="90" y="170" width="220" height="140" rx="14" fill="#ffffff"/>
  <rect x="90" y="170" width="220" height="34" rx="10" fill="#1f2937"/>
  <rect x="90" y="170" width="220" height="34" rx="10" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Diagonal stripes on clapper top -->
  <path d="M 100 186 L 120 170 L 145 170 L 125 186 Z" fill="#ffffff"/>
  <path d="M 155 186 L 175 170 L 200 170 L 180 186 Z" fill="#ffffff"/>
  <path d="M 210 186 L 230 170 L 255 170 L 235 186 Z" fill="#ffffff"/>
  <path d="M 265 186 L 285 170 L 310 170 L 290 186 Z" fill="#ffffff"/>

  <!-- Neural nodes inside the board (directed graph) -->
  <circle cx="140" cy="250" r="7" fill="#8b5cf6"/>
  <circle cx="200" cy="240" r="7" fill="#8b5cf6"/>
  <circle cx="260" cy="255" r="7" fill="#8b5cf6"/>
  <circle cx="170" cy="285" r="6" fill="#06b6d4"/>
  <circle cx="230" cy="285" r="6" fill="#06b6d4"/>
  <line x1="140" y1="250" x2="200" y2="240" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="200" y1="240" x2="260" y2="255" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="140" y1="250" x2="170" y2="285" stroke="#06b6d4" stroke-width="3"/>
  <line x1="200" y1="240" x2="170" y2="285" stroke="#06b6d4" stroke-width="3"/>
  <line x1="200" y1="240" x2="230" y2="285" stroke="#06b6d4" stroke-width="3"/>
  <line x1="260" y1="255" x2="230" y2="285" stroke="#06b6d4" stroke-width="3"/>
</svg>
