<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgL)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glowL)"/>

  <!-- Magnifier body -->
  <circle cx="180" cy="180" r="78" fill="none" stroke="#ffffff" stroke-width="14"/>
  <line x1="238" y1="238" x2="312" y2="312" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- Inner neural nodes inside the lens -->
  <circle cx="150" cy="160" r="6" fill="#ffffff"/>
  <circle cx="200" cy="140" r="6" fill="#ffffff"/>
  <circle cx="210" cy="195" r="6" fill="#ffffff"/>
  <circle cx="155" cy="205" r="6" fill="#ffffff"/>
  <line x1="150" y1="160" x2="200" y2="140" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <line x1="200" y1="140" x2="210" y2="195" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <line x1="210" y1="195" x2="155" y2="205" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <line x1="155" y1="205" x2="150" y2="160" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85"/>
  <line x1="150" y1="160" x2="210" y2="195" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
</svg>
