name = "aeo-bot-ips"
main = "src/index.js"
compatibility_date = "2026-10-12"
preview_urls = false

[observability]
enabled = true

# KV namespace for cached IP lists.
# Create it first with: wrangler kv namespace create BOT_IPS
# Then paste the id below.
[[kv_namespaces]]
binding = "BOT_IPS"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["0 3 * * *"]  # daily at 3am UTC
