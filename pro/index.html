<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Torch – Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: #f8fafc; }
    .dark body { background: #0f172a; }
    .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); }
    .tab-active { border-bottom: 3px solid #f97316; color: #f97316; }
    input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body class="min-h-screen text-gray-900 dark:text-gray-100">
<div x-data="app()" x-init="init()" class="max-w-7xl mx-auto px-4 py-8">
  <header class="flex flex-wrap items-center justify-between gap-4 mb-10">
    <div><span class="text-3xl">🚀</span><h1 class="inline text-2xl font-black bg-gradient-to-r from-orange-400 to-pink-600 bg-clip-text text-transparent">Traffic Torch</h1></div>
    <div>
      <button @click="toggleTheme()" class="text-2xl" x-text="theme === 'dark' ? '☀️' : '🌙'"></button>
      <span x-show="token" class="px-3 py-1 rounded-full text-xs font-semibold" :class="tier === 'free' ? 'bg-gray-200' : 'bg-green-500/20 text-green-600'"><span x-text="tier.toUpperCase()"></span></span>
      <button @click="logout()" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm" x-show="token">Logout</button>
    </div>
  </header>

  <!-- LOGIN -->
  <div x-show="!token" class="max-w-md mx-auto">
    <div class="glass rounded-3xl p-8 shadow-2xl">
      <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>
      <form @submit.prevent="sendMagicLink()" class="space-y-4">
        <input type="email" x-model="email" placeholder="Your email" required class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-black/50 focus:ring-2 focus:ring-orange-500 outline-none">
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold rounded-xl" :disabled="loading">
          <span x-text="loading ? 'Sending...' : 'Send Magic Link'"></span>
        </button>
        <p class="text-sm text-center text-gray-500">We'll email you a link to log in instantly.</p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div x-show="token" x-cloak>
    <nav class="flex flex-wrap gap-2 border-b border-gray-200 dark:border-gray-700 mb-8">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="activeTab = tab.id" class="px-5 py-2.5 text-sm font-medium" :class="activeTab === tab.id ? 'tab-active' : 'text-gray-500'"><span x-text="tab.label"></span></button>
      </template>
    </nav>

    <div x-show="activeTab === 'dashboard'">
      <div class="grid md:grid-cols-2 gap-6 mb-8">
        <div class="glass rounded-2xl p-6">
          <h3 class="text-sm text-gray-500">Daily Audits</h3>
          <p class="text-3xl font-bold mt-2" x-text="`${dailyUsed} / ${uiDailyLimit}`"></p>
          <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4">
            <div class="bg-gradient-to-r from-orange-500 to-pink-600 h-2.5 rounded-full" :style="`width: ${uiDailyLimit ? (dailyUsed/uiDailyLimit)*100 : 0}%`"></div>
          </div>
          <p class="text-sm mt-2" x-text="`${dailyRemaining} remaining today`"></p>
        </div>
        <div class="glass rounded-2xl p-6">
          <h3 class="text-sm text-gray-500">Quick Audit</h3>
          <input type="url" x-model="quickUrl" placeholder="https://example.com" class="w-full mt-2 p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white/50">
          <button @click="runQuickAudit()" class="mt-3 w-full py-2 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold rounded-lg">Analyze</button>
          <div x-show="quickResult" class="mt-4 text-sm grid grid-cols-3 gap-2">
            <div><span class="text-gray-500">UX</span> <span x-text="quickResult.ux"></span></div>
            <div><span class="text-gray-500">SEO</span> <span x-text="quickResult.seo"></span></div>
            <div><span class="text-gray-500">AI</span> <span x-text="quickResult.ai"></span></div>
          </div>
        </div>
      </div>
      <div x-show="tier === 'free'" class="text-center py-8">
        <button @click="upgrade()" class="px-8 py-4 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold rounded-2xl shadow-lg">🚀 Upgrade to Pro</button>
      </div>
    </div>

    <div x-show="activeTab === 'settings'" x-cloak>
      <div class="glass rounded-2xl p-6 max-w-2xl">
        <h3 class="text-xl font-bold mb-4">Account Settings</h3>
        <div class="flex justify-between p-4 border-b"><span>Email</span><span x-text="email"></span></div>
        <div class="flex justify-between p-4 border-b"><span>Plan</span><span x-text="tier.toUpperCase()"></span></div>
        <button @click="logout()" class="mt-6 w-full py-3 bg-red-600 text-white rounded-lg">Logout</button>
      </div>
    </div>
  </div>
  <footer class="text-center text-sm text-gray-500 mt-16">Traffic Torch v3.0</footer>
</div>

<script>
const API_BASE = 'https://traffictorch.net';

function app() {
  return {
    token: localStorage.getItem('authToken'),
    email: '',
    loading: false,
    tier: 'free',
    uiDailyLimit: 3,
    dailyUsed: 0,
    dailyRemaining: 3,
    activeTab: 'dashboard',
    quickUrl: '',
    quickResult: { ux: 0, seo: 0, ai: 0 },
    theme: localStorage.getItem('theme') || 'light',

    get tabs() { return [{ id: 'dashboard', label: '📊 Dashboard' }, { id: 'settings', label: '⚙️ Settings' }]; },

    init() { this.applyTheme(); if (this.token) this.loadAccountInfo(); },

    applyTheme() { document.documentElement.classList.toggle('dark', this.theme === 'dark'); },
    toggleTheme() { this.theme = this.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', this.theme); this.applyTheme(); },

    async loadAccountInfo() {
      try {
        const res = await fetch(`${API_BASE}/api/account-info`, {
          headers: { 'Authorization': `Bearer ${this.token}` }
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        this.tier = data.tier;
        this.email = data.email;
        this.uiDailyLimit = data.uiDailyLimit;
        this.dailyUsed = data.dailyUsed;
        this.dailyRemaining = data.dailyRemaining;
      } catch { this.token = null; localStorage.removeItem('authToken'); }
    },

    async sendMagicLink() {
      this.loading = true;
      try {
        const res = await fetch(`${API_BASE}/api/auth/magic-link`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email })
        });
        const data = await res.json();
        alert(res.ok ? data.message : data.error);
      } catch { alert('Error sending link.'); }
      this.loading = false;
    },

    logout() { localStorage.removeItem('authToken'); this.token = null; window.location.reload(); },

    runQuickAudit() {
      if (!this.quickUrl) return;
      this.quickResult = { ux: Math.round(60+Math.random()*30), seo: Math.round(60+Math.random()*30), ai: Math.round(60+Math.random()*30) };
    },

    upgrade() { alert('Coming soon.'); }
  };
}
</script>
</body>
</html>
