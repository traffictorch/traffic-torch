<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Torch – Pro Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .tab-active { border-bottom: 3px solid #f97316; color: #f97316; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .dark .glass { background: rgba(0,0,0,0.3); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

<div x-data="app()" x-init="init()" class="max-w-7xl mx-auto px-4 py-8">

  <!-- ========================================================== -->
  <!-- LOGIN SECTION (shown when no token) -->
  <!-- ========================================================== -->
  <div x-show="!token" class="max-w-md mx-auto">
    <div class="glass rounded-3xl p-8 shadow-2xl">
      <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>

      <!-- MAGIC LINK FORM (default) -->
      <div x-show="!showPasswordLogin">
        <form @submit.prevent="sendMagicLink()" class="space-y-4">
          <input type="email" x-model="email" placeholder="Your email" required class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-black/50 focus:ring-2 focus:ring-orange-500 outline-none">
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold rounded-xl hover:opacity-90 transition" :disabled="loading">
            <span x-text="loading ? 'Sending...' : 'Send Magic Link'"></span>
          </button>
          <p class="text-sm text-center text-gray-500">We'll email you a link to log in instantly.</p>
          <p class="text-sm text-center text-gray-400">
            <a href="#" @click.prevent="showPasswordLogin = true" class="underline hover:text-orange-500">Login with password instead</a>
          </p>
        </form>
      </div>

      <!-- PASSWORD LOGIN / REGISTER -->
      <div x-show="showPasswordLogin" x-cloak>
        <div class="space-y-4">
          <input type="email" x-model="email" placeholder="Email" required class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-black/50 focus:ring-2 focus:ring-orange-500 outline-none">
          <input type="password" x-model="password" placeholder="Password (min 8 chars)" required class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-black/50 focus:ring-2 focus:ring-orange-500 outline-none">
          <button @click="login()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition">Login</button>
          <button @click="register()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition">Register</button>
          <p class="text-sm text-center text-gray-400">
            <a href="#" @click.prevent="showPasswordLogin = false" class="underline hover:text-orange-500">← Back to magic link</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- DASHBOARD SECTION (shown when token exists) -->
  <!-- ========================================================== -->
  <div x-show="token" x-cloak>

    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <h1 class="text-3xl font-black bg-gradient-to-r from-orange-400 to-pink-600 bg-clip-text text-transparent">
        🚀 Traffic Torch Dashboard
      </h1>
      <div class="flex items-center gap-4">
        <span class="px-4 py-2 rounded-full text-sm font-semibold" :class="tier === 'free' ? 'bg-gray-200 dark:bg-gray-700' : 'bg-green-500/20 text-green-600 dark:text-green-400'">
          <span x-text="tier.toUpperCase()"></span>
        </span>
        <button @click="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm">Logout</button>
      </div>
    </div>

    <!-- Error banner -->
    <div x-show="errorMessage" class="mb-6 p-4 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-lg border border-red-300 dark:border-red-700">
      <p x-text="errorMessage"></p>
      <button @click="errorMessage = ''" class="text-sm underline">Dismiss</button>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 border-b border-gray-200 dark:border-gray-700 mb-8">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="activeTab = tab.id" 
                class="px-6 py-3 text-sm font-medium transition-all duration-200"
                :class="activeTab === tab.id ? 'tab-active' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200'"
                x-show="tab.show">
          <span x-text="tab.label"></span>
        </button>
      </template>
    </div>

    <!-- Dashboard tab content -->
    <div x-show="activeTab === 'dashboard'" x-cloak>
      <div class="grid md:grid-cols-3 gap-6 mb-8">
        <!-- Usage Card -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-sm text-gray-500 dark:text-gray-400">Daily Audits Used</h3>
          <p class="text-3xl font-bold mt-2" x-text="`${dailyUsed} / ${uiDailyLimit}`"></p>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-4">
            <div class="bg-gradient-to-r from-orange-500 to-pink-600 h-2.5 rounded-full transition-all" :style="`width: ${(dailyUsed/uiDailyLimit)*100}%`"></div>
          </div>
          <p class="text-sm mt-2" x-text="`${dailyRemaining} remaining today`"></p>
        </div>
        <!-- API Usage -->
        <div class="glass rounded-2xl p-6" x-show="features.api">
          <h3 class="text-sm text-gray-500 dark:text-gray-400">API Calls Today</h3>
          <p class="text-3xl font-bold mt-2" x-text="`${apiUsed || 0} / ${apiDailyLimit || 0}`"></p>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mt-4">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 h-2.5 rounded-full transition-all" :style="`width: ${apiDailyLimit ? (apiUsed/apiDailyLimit)*100 : 0}%`"></div>
          </div>
        </div>
        <!-- Quick Audit -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-sm text-gray-500 dark:text-gray-400">Quick Audit</h3>
          <input type="url" x-model="quickUrl" placeholder="https://example.com" class="w-full mt-2 p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white/50 dark:bg-black/50">
          <button @click="runQuickAudit()" class="mt-3 w-full py-2 bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold rounded-lg hover:opacity-90">Analyze</button>
          <div x-show="quickResult" class="mt-4 text-sm">
            <p>UX: <span x-text="quickResult.ux"></span></p>
            <p>SEO: <span x-text="quickResult.seo"></span></p>
            <p>AI: <span x-text="quickResult.ai"></span></p>
          </div>
        </div>
      </div>
      <!-- Recent audits -->
      <h3 class="text-lg font-bold mb-4">Recent Audits</h3>
      <div class="glass rounded-2xl overflow-hidden">
        <table class="w-full text-left">
          <thead class="bg-gray-100 dark:bg-gray-800">
            <tr><th class="p-3">URL</th><th class="p-3">UX</th><th class="p-3">SEO</th><th class="p-3">AI</th><th class="p-3">Date</th></tr>
          </thead>
          <tbody>
            <template x-for="audit in recentAudits" :key="audit.id">
              <tr class="border-t border-gray-200 dark:border-gray-700">
                <td class="p-3 text-sm truncate max-w-[200px]" x-text="audit.url"></td>
                <td class="p-3" x-text="audit.ux_score"></td>
                <td class="p-3" x-text="audit.seo_score"></td>
                <td class="p-3" x-text="audit.ai_score"></td>
                <td class="p-3 text-sm" x-text="new Date(audit.timestamp).toLocaleDateString()"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Other tabs (analytics, integrations, api-keys, settings) – keep as before -->
    <!-- I've truncated for brevity, but include them in the final file -->
    <div x-show="activeTab === 'analytics'" x-cloak>...</div>
    <div x-show="activeTab === 'integrations'" x-cloak>...</div>
    <div x-show="activeTab === 'api-keys'" x-cloak>...</div>
    <div x-show="activeTab === 'settings'" x-cloak>...</div>

    <p class="text-center text-sm text-gray-500 mt-12">Traffic Torch v2.0 – Privacy-first</p>
  </div>
</div>

<script>
function app() {
  return {
    token: localStorage.getItem('authToken'),
    email: '',
    password: '',
    loading: false,
    showPasswordLogin: false,
    tier: 'free',
    email: '',
    features: { analytics: false, export: false, api: false },
    uiDailyLimit: 3,
    apiDailyLimit: 0,
    dailyUsed: 0,
    dailyRemaining: 3,
    apiUsed: 0,
    activeTab: 'dashboard',
    quickUrl: '',
    quickResult: null,
    recentAudits: [],
    analytics: { clicks: 0, impressions: 0, ctr: 0, position: 0, daily: [] },
    analyticsStatus: '',
    googleConnected: false,
    selectedProperty: 'https://traffictorch.net',
    apiKeys: [],
    newKeyName: '',
    generatedKey: null,
    errorMessage: '',
    _chart: null,

    tabs() {
      return [
        { id: 'dashboard', label: '📊 Dashboard', show: true },
        { id: 'analytics', label: '📈 Analytics', show: true },
        { id: 'integrations', label: '🔗 Integrations', show: true },
        { id: 'api-keys', label: '🔑 API Keys', show: this.features.api },
        { id: 'settings', label: '⚙️ Settings', show: true }
      ];
    },

    async init() {
      // If token exists, load dashboard data
      if (this.token) {
        await this.loadAccountInfo();
        await this.loadRecentAudits();
        if (this.features.api) await this.loadApiKeys();
      }
      // If no token, show login form (default)
    },

    // ---------- MAGIC LINK ----------
    async sendMagicLink() {
      this.loading = true;
      try {
        const res = await fetch('https://traffictorch.net/api/auth/magic-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email })
        });
        const data = await res.json();
        alert(res.ok ? data.message : data.error);
      } catch (e) {
        alert('Error sending link. Try again.');
      } finally {
        this.loading = false;
      }
    },

    // ---------- PASSWORD LOGIN ----------
    async login() {
      // Call your /api/login endpoint (you'll need to add it to Worker)
      // For now, placeholder alert
      alert('Login endpoint not yet implemented. Use magic link for now.');
    },

    // ---------- PASSWORD REGISTER ----------
    async register() {
      // Call your /api/register endpoint
      alert('Register endpoint not yet implemented. Use magic link for now.');
    },

    // ---------- DASHBOARD METHODS ----------
    async loadAccountInfo() {
      const token = localStorage.getItem('authToken');
      try {
        const res = await fetch('https://traffictorch.net/api/account-info', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load account');
        const data = await res.json();
        this.tier = data.tier || 'free';
        this.email = data.email || '';
        this.features = data.features || { analytics: false, export: false, api: false };
        this.uiDailyLimit = data.uiDailyLimit || 3;
        this.apiDailyLimit = data.apiDailyLimit || 0;
        this.dailyUsed = data.dailyUsed || 0;
        this.dailyRemaining = data.dailyRemaining || 0;
      } catch (err) {
        console.error(err);
        this.errorMessage = err.message || 'Unable to load account.';
      }
    },

    async loadRecentAudits() {
      const token = localStorage.getItem('authToken');
      try {
        const res = await fetch('https://traffictorch.net/api/audit-history?limit=10', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) this.recentAudits = await res.json();
      } catch (e) { /* ignore */ }
    },

    async runQuickAudit() {
      if (!this.quickUrl) return;
      // Mock or call real endpoint
      this.quickResult = { ux: 78, seo: 65, ai: 92 };
    },

    async fetchAnalytics(range) { /* ... */ },
    renderChart(data) { /* ... */ },
    async loadApiKeys() { /* ... */ },
    async generateApiKey() { /* ... */ },
    async revokeApiKey(id) { /* ... */ },

    logout() {
      localStorage.removeItem('authToken');
      this.token = null;
      window.location.reload();
    },

    deleteAccount() {
      if (confirm('Permanently delete your account?')) {
        alert('Account deletion not yet implemented.');
      }
    }
  };
}
</script>
</body>
</html>
