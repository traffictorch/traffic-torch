<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Torch NUSA</title>
<meta name="description" content="NUSA audits a URL across UX, SEO and AEO in one live stream. No score circles. No dashboards.">
<link rel="stylesheet" href="./css/nusa.css">
</head>
<body>
<header class="nusa-bar">
  <span class="brand">NUSA</span>
  <span class="sep">/</span>
  <span class="tag">Next-level UX · SEO · AEO</span>
  <span class="spacer"></span>
</header>
<main>
  <form id="url-form" class="url-bar" autocomplete="off">
    <span class="caret">▸</span>
    <input id="url-input" type="text" inputmode="url" placeholder="paste a URL — try traffictorch.net" required>
    <button type="submit" aria-label="Run audit">↵</button>
  </form>
  <div id="ruler" class="ruler hidden" aria-hidden="true">
    <div class="ruler-track"></div>
    <div class="playhead" id="playhead"></div>
  </div>
  <section id="summary-cards" class="summary-cards hidden" aria-label="Audit summary"></section>
  <section id="stage" class="stage hidden">
    <div class="col narration-col">
      <div class="col-head">
        <span>FIX LIST</span>
        <span id="status" class="num">idle</span>
      </div>
      <div id="narration" class="narration"></div>
      <form id="ask-form" class="ask" autocomplete="off">
        <span class="violet-mark">✦</span>
        <input id="ask-input" placeholder="ask nusa anything…" autocomplete="off">
      </form>
    </div>
    <div class="col preview-col">
      <div class="col-head">
        <span>PREVIEW</span>
        <span id="preview-meta" class="num">·</span>
      </div>
      <div id="preview" class="preview">
        <div class="preview-empty">paste a url to begin</div>
      </div>
    </div>
  </section>
  <section id="chamber" class="chamber hidden">
    <div class="col-head">
      <span>CITATION CHAMBER</span>
      <span class="num">simulated engines</span>
    </div>
    <form id="chamber-form" class="chamber-form" autocomplete="off">
      <span class="violet-mark">▶</span>
      <input id="chamber-input" placeholder="What would a user ask this page?" autocomplete="off">
      <button type="submit">run simulation</button>
    </form>
    <div id="chamber-out" class="chamber-out"></div>
  </section>
</main>
<footer class="nusa-foot">
  <span>Blueprint Noir</span>
  <span class="spacer"></span>
  <span id="foot-meta" class="num">ready</span>
</footer>
<script type="module" src="./js/nusa.js"></script>
</body>
</html>
