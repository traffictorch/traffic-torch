<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Traffic Torch</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://traffictorch.net/login/" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)" />

    <!-- Preload CSS -->
    <link rel="preload" as="style" href="/style-v1.0.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/style-v1.0.css" /></noscript>
    <style>html{visibility:hidden;opacity:0;transition:opacity 0.4s ease}</style>
    <link rel="preload" as="style" href="/tailwind-local-v1.0.css" onload="this.onload=null;this.rel='stylesheet';document.documentElement.style.visibility='visible';document.documentElement.style.opacity='1'" />
    <noscript><style>html{visibility:visible;opacity:1}</style><link rel="stylesheet" href="/tailwind-local-v1.0.css" /></noscript>

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        /* ── Same styles as original login, but with eye SVG ── */
        [x-cloak] { display: none !important; }
        .tab-active {
            border-bottom: 3px solid #f97316;
            color: #f97316;
        }
        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dark .glass {
            background: rgba(0,0,0,0.3);
        }
        .auth-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .auth-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.25);
        }
        .dark .auth-card:hover {
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.6);
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.1rem;
            pointer-events: none;
        }
        .dark .input-icon {
            color: #6b7280;
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            background: rgba(255,255,255,0.6);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            font-size: 1rem;
        }
        .dark .input-field {
            border-color: #374151;
            background: rgba(0,0,0,0.4);
            color: #f3f4f6;
        }
        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.2);
        }
        .dark .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.3);
        }
        .input-field.password-field {
            padding-right: 3.2rem;
        }
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            padding: 0.25rem;
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #6b7280;
        }
        .dark .toggle-password:hover {
            color: #d1d5db;
        }
        .toggle-password svg {
            width: 1.25rem;
            height: 1.25rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ec4899);
            color: white;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            font-size: 1rem;
        }
        .btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.01);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #3b82f6;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-size: 1rem;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #2563eb;
            transform: scale(1.01);
        }
        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-success {
            background: #22c55e;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-size: 1rem;
        }
        .btn-success:hover:not(:disabled) {
            background: #16a34a;
            transform: scale(1.01);
        }
        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem 0;
            font-size: 0.9rem;
            font-weight: 500;
            color: #6b7280;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .dark .tab-btn {
            color: #9ca3af;
        }
        .tab-btn:hover {
            color: #374151;
        }
        .dark .tab-btn:hover {
            color: #e5e7eb;
        }
        .tab-btn.active {
            color: #f97316;
            border-bottom-color: #f97316;
        }
        .dark .tab-btn.active {
            color: #f97316;
            border-bottom-color: #f97316;
        }

        .message-box {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .message-box.error {
            background: #fee2e2;
            color: #b91c1c;
        }
        .dark .message-box.error {
            background: #7f1d1d;
            color: #fca5a5;
        }
        .message-box.success {
            background: #dcfce7;
            color: #166534;
        }
        .dark .message-box.success {
            background: #14532d;
            color: #86efac;
        }
        .message-box.info {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .message-box.info {
            background: #1e3a5f;
            color: #93c5fd;
        }

        .spinner {
            display: inline-block;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-link {
            color: #6b7280;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #f97316;
        }
        .dark .forgot-link {
            color: #9ca3af;
        }
        .dark .forgot-link:hover {
            color: #f97316;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
            color: #9ca3af;
            font-size: 0.85rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .dark .divider::before,
        .dark .divider::after {
            background: #374151;
        }

        .reset-box {
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1rem;
            background: rgba(255,255,255,0.3);
        }
        .dark .reset-box {
            border-color: #374151;
            background: rgba(0,0,0,0.2);
        }

        .tab-panel.hidden {
            display: none;
        }

        .brand-gradient {
            background: linear-gradient(135deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #themeToggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 9999px;
            padding: 0.5rem 0.8rem;
            font-size: 1.25rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            color: #1f2937;
        }
        .dark #themeToggle {
            color: #f3f4f6;
            background: rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.1);
        }
        #themeToggle:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.25);
        }
        .dark #themeToggle:hover {
            background: rgba(255,255,255,0.1);
        }

        @media (max-width: 480px) {
            .auth-card { padding: 1.5rem 1rem; }
            .tab-btn { font-size: 0.8rem; padding: 0.5rem 0; }
            .input-field { font-size: 0.95rem; padding: 0.65rem 0.65rem 0.65rem 2.5rem; }
            .input-icon { left: 0.75rem; font-size: 1rem; }
            .input-field.password-field { padding-right: 2.8rem; }
            .toggle-password svg { width: 1rem; height: 1rem; }
        }
    </style>
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex items-center justify-center p-4">

    <!-- Theme toggle -->
    <button id="themeToggle" aria-label="Toggle theme">🌙</button>

    <!-- ─── MAIN CARD ─── -->
    <div class="w-full max-w-md auth-card glass rounded-2xl shadow-2xl p-6 md:p-8">

        <!-- Brand -->
        <div class="flex flex-col items-center mb-6">
            <img src="/logo-160w.webp" class="w-16 rounded-xl mb-3" alt="Traffic Torch" width="64" height="64" loading="eager" />
            <h1 class="text-2xl font-extrabold brand-gradient tracking-tight">Traffic Torch</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Sign in to your Pro account</p>
        </div>

        <!-- Message -->
        <div id="messageBox" class="message-box hidden" role="alert"></div>

        <!-- Tabs: Magic Link, Login, Register -->
        <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6" role="tablist">
            <button class="tab-btn active" data-tab="magic" role="tab" aria-selected="true">Magic Link</button>
            <button class="tab-btn" data-tab="login" role="tab" aria-selected="false">Login</button>
            <button class="tab-btn" data-tab="register" role="tab" aria-selected="false">Register</button>
        </div>

        <!-- ─── MAGIC LINK PANEL ─── -->
        <div id="panel-magic" class="tab-panel" role="tabpanel">
            <form id="magicForm" novalidate>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">We'll email you a one‑click login link. No password needed.</p>
                <div class="relative mb-4">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="magicEmail" class="input-field" placeholder="Email address" required autocomplete="email" />
                </div>
                <button type="submit" class="btn-primary" id="magicBtn">
                    <span class="btn-text">Send Magic Link</span>
                </button>
            </form>
        </div>

        <!-- ─── LOGIN PANEL ─── -->
        <div id="panel-login" class="tab-panel hidden" role="tabpanel">
            <form id="loginForm" autocomplete="on" novalidate>
                <div class="relative mb-4">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="loginEmail" class="input-field" placeholder="Email address" required autocomplete="email" />
                </div>
                <div class="relative mb-3">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="loginPassword" class="input-field password-field" placeholder="Password" required autocomplete="current-password" />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="loginPassword">
                        <!-- Eye SVG (visible) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="eye-icon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-end mb-4">
                    <button type="button" id="forgotBtn" class="forgot-link">Forgot password?</button>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <!-- Forgot password (inline) -->
            <div id="forgotBox" class="reset-box hidden">
                <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">Enter your email and we'll send you a reset link.</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="email" id="resetEmail" class="input-field flex-1" placeholder="Your email" style="padding-left:1rem;" />
                    <button id="resetSendBtn" class="btn-secondary" style="flex-shrink:0;padding:0.65rem 1.25rem;">Send</button>
                </div>
                <button type="button" id="cancelResetBtn" class="forgot-link text-sm mt-2">Cancel</button>
            </div>
        </div>

        <!-- ─── REGISTER PANEL ─── -->
        <div id="panel-register" class="tab-panel hidden" role="tabpanel">
            <form id="registerForm" novalidate>
                <div class="relative mb-4">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="regEmail" class="input-field" placeholder="Email address" required autocomplete="email" />
                </div>
                <div class="relative mb-3">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="regPassword" class="input-field password-field" placeholder="Password (min 8 chars)" required autocomplete="new-password" minlength="8" />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="regPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="eye-icon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="relative mb-4">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="regConfirm" class="input-field password-field" placeholder="Confirm password" required autocomplete="new-password" />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="regConfirm">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="eye-icon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <button type="submit" class="btn-success" id="registerBtn">
                    <span class="btn-text">Create Account</span>
                </button>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-3 text-center">By registering, you agree to our Terms of Service.</p>
            </form>
        </div>

        <!-- Divider -->
        <div class="divider">or continue with</div>

        <!-- Extra links -->
        <div class="text-center">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                New here?
                <button type="button" class="text-orange-500 hover:underline font-medium" data-tab="register">Create an account</button>
            </p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">
                Free tier: 3 audits/day · <a href="/pro/upgrade" class="text-orange-400 hover:underline">Upgrade to Pro →</a>
            </p>
        </div>
    </div>

    <!-- ─── SCRIPTS ─── -->
    <script>
        (function() {
            'use strict';

            // ─── Constants ───
            const API_BASE = 'https://traffic-torch-auth.traffictorch.workers.dev';
            const REDIRECT_URL = '/dashboard/';

            // ─── DOM refs ───
            const $ = (sel, ctx = document) => ctx.querySelector(sel);
            const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

            const messageBox = $('#messageBox');
            const tabs = $$('.tab-btn');
            const panels = {
                magic: $('#panel-magic'),
                login: $('#panel-login'),
                register: $('#panel-register')
            };

            // Magic
            const magicForm = $('#magicForm');
            const magicEmail = $('#magicEmail');
            const magicBtn = $('#magicBtn');

            // Login
            const loginForm = $('#loginForm');
            const loginEmail = $('#loginEmail');
            const loginPassword = $('#loginPassword');
            const loginBtn = $('#loginBtn');

            // Register
            const regForm = $('#registerForm');
            const regEmail = $('#regEmail');
            const regPassword = $('#regPassword');
            const regConfirm = $('#regConfirm');
            const regBtn = $('#registerBtn');

            // Forgot
            const forgotBtn = $('#forgotBtn');
            const forgotBox = $('#forgotBox');
            const resetEmail = $('#resetEmail');
            const resetSendBtn = $('#resetSendBtn');
            const cancelResetBtn = $('#cancelResetBtn');

            // Theme
            const themeToggle = $('#themeToggle');

            // ─── State ───
            let loading = false;
            let messageTimeout = null;

            // ─── Helpers ───
            function setMessage(text, type = 'error') {
                if (!messageBox) return;
                messageBox.textContent = text;
                messageBox.className = 'message-box ' + type;
                messageBox.classList.remove('hidden');
                clearTimeout(messageTimeout);
                if (text) {
                    messageTimeout = setTimeout(() => {
                        messageBox.classList.add('hidden');
                    }, 6000);
                } else {
                    messageBox.classList.add('hidden');
                }
            }

            function clearMessage() {
                if (messageBox) {
                    messageBox.classList.add('hidden');
                    messageBox.textContent = '';
                }
                clearTimeout(messageTimeout);
            }

            function setLoading(btn, state) {
                const span = btn?.querySelector('.btn-text');
                if (!span) return;
                if (state) {
                    span.innerHTML = '<span class="spinner"></span> Loading…';
                    btn.disabled = true;
                } else {
                    const original = btn.dataset.originalText || 'Submit';
                    span.textContent = original;
                    btn.disabled = false;
                }
            }

            function storeToken(token) {
                if (!token) return;
                localStorage.setItem('authToken', token);
                localStorage.setItem('traffic_torch_jwt', token);
            }

            function getToken() {
                return localStorage.getItem('authToken') || localStorage.getItem('traffic_torch_jwt');
            }

            function redirectToDashboard() {
                window.location.href = REDIRECT_URL;
            }

            // ─── Tab switching ───
            function switchTab(tabId) {
                tabs.forEach(btn => {
                    const id = btn.dataset.tab;
                    const isActive = id === tabId;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-selected', isActive);
                });
                Object.keys(panels).forEach(key => {
                    panels[key].classList.toggle('hidden', key !== tabId);
                });
                clearMessage();
            }

            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(btn.dataset.tab);
                });
            });

            // "Create an account" link
            document.querySelector('[data-tab="register"]')?.addEventListener('click', () => switchTab('register'));

            // ─── Password toggle (SVG eye) ───
            function togglePasswordVisibility(button) {
                const inputId = button.dataset.target;
                if (!inputId) return;
                const input = document.getElementById(inputId);
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                const svg = button.querySelector('svg');
                if (!svg) return;
                if (isPassword) {
                    // show eye-off (slashed)
                    svg.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    `;
                } else {
                    // show eye (open)
                    svg.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    `;
                }
            }

            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    togglePasswordVisibility(this);
                });
            });

            // ─── Theme toggle ───
            if (themeToggle) {
                const html = document.documentElement;
                const updateThemeIcon = () => {
                    themeToggle.textContent = html.classList.contains('dark') ? '☀️' : '🌙';
                };
                updateThemeIcon();
                themeToggle.addEventListener('click', () => {
                    html.classList.toggle('dark');
                    localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
                    updateThemeIcon();
                });
            }

            // ─── API calls ───
            async function apiCall(endpoint, method = 'POST', body = null) {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(API_BASE + endpoint, options);
                const data = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, data };
            }

            // ─── Magic Link ───
            magicForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearMessage();
                const email = magicEmail.value.trim();
                if (!email) {
                    setMessage('Please enter your email.', 'error');
                    return;
                }
                setLoading(magicBtn, true);
                const { ok, data } = await apiCall('/api/auth/magic-link', 'POST', { email });
                setLoading(magicBtn, false);
                if (ok) {
                    setMessage('Magic link sent! Check your email.', 'success');
                    magicEmail.value = '';
                } else {
                    setMessage(data.error || 'Failed to send magic link.', 'error');
                }
            });

            // ─── Login ───
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearMessage();
                const email = loginEmail.value.trim();
                const password = loginPassword.value;
                if (!email || !password) {
                    setMessage('Please fill in all fields.', 'error');
                    return;
                }
                setLoading(loginBtn, true);
                const { ok, data } = await apiCall('/api/login', 'POST', { email, password });
                setLoading(loginBtn, false);
                if (ok && data.token) {
                    storeToken(data.token);
                    setMessage('Login successful! Redirecting…', 'success');
                    setTimeout(redirectToDashboard, 800);
                } else {
                    setMessage(data.error || 'Login failed. Please try again.', 'error');
                }
            });

            // ─── Register ───
            regForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearMessage();
                const email = regEmail.value.trim();
                const password = regPassword.value;
                const confirm = regConfirm.value;
                if (!email || !password || !confirm) {
                    setMessage('Please fill in all fields.', 'error');
                    return;
                }
                if (password.length < 8) {
                    setMessage('Password must be at least 8 characters.', 'error');
                    return;
                }
                if (password !== confirm) {
                    setMessage('Passwords do not match.', 'error');
                    return;
                }
                setLoading(regBtn, true);
                const { ok, data } = await apiCall('/api/register', 'POST', { email, password });
                setLoading(regBtn, false);
                if (ok && data.token) {
                    storeToken(data.token);
                    setMessage('Account created! Redirecting…', 'success');
                    setTimeout(redirectToDashboard, 800);
                } else {
                    setMessage(data.error || 'Registration failed.', 'error');
                }
            });

            // ─── Forgot password ───
            forgotBtn.addEventListener('click', function() {
                forgotBox.classList.toggle('hidden');
                if (!forgotBox.classList.contains('hidden')) {
                    resetEmail.focus();
                }
            });

            cancelResetBtn.addEventListener('click', function() {
                forgotBox.classList.add('hidden');
                resetEmail.value = '';
                clearMessage();
            });

            resetSendBtn.addEventListener('click', async function() {
                const email = resetEmail.value.trim();
                if (!email) {
                    setMessage('Please enter your email.', 'error');
                    return;
                }
                setLoading(resetSendBtn, true);
                const { ok, data } = await apiCall('/api/forgot-password', 'POST', { email });
                setLoading(resetSendBtn, false);
                if (ok) {
                    setMessage('If an account exists, a reset link was sent.', 'success');
                    resetEmail.value = '';
                    forgotBox.classList.add('hidden');
                } else {
                    setMessage(data.error || 'Failed to send reset link.', 'error');
                }
            });

            // ─── Handle magic token in URL ───
            (function handleMagicToken() {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('magic_token');
                if (token) {
                    storeToken(token);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    setMessage('Magic login successful! Redirecting…', 'success');
                    setTimeout(redirectToDashboard, 800);
                }
            })();

            // ─── Handle reset token (show inline reset form) ───
            const resetTokenParam = new URLSearchParams(window.location.search).get('reset_token');
            if (resetTokenParam) {
                const card = document.querySelector('.auth-card');
                const resetFormHtml = `
                    <div id="resetPasswordForm" class="mt-6 p-4 border border-orange-300 rounded-xl bg-orange-50 dark:bg-gray-800 dark:border-orange-700">
                        <h3 class="text-lg font-bold mb-2">Set new password</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300 mb-3">Enter your new password below.</p>
                        <div class="relative mb-3">
                            <input type="password" id="resetNewPassword" class="input-field password-field" placeholder="New password" required />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="resetNewPassword">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="eye-icon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <div class="relative mb-3">
                            <input type="password" id="resetConfirmPassword" class="input-field password-field" placeholder="Confirm password" required />
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="resetConfirmPassword">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="eye-icon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <button id="resetPasswordBtn" class="btn-primary">Reset Password</button>
                        <button type="button" id="cancelResetPasswordBtn" class="forgot-link mt-2">Cancel</button>
                    </div>
                `;
                card.insertAdjacentHTML('beforeend', resetFormHtml);

                // Attach toggle for new fields
                document.querySelectorAll('#resetPasswordForm .toggle-password').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        togglePasswordVisibility(this);
                    });
                });

                document.getElementById('resetPasswordBtn').addEventListener('click', async function() {
                    const newPass = document.getElementById('resetNewPassword').value;
                    const confirmPass = document.getElementById('resetConfirmPassword').value;
                    if (!newPass || !confirmPass) {
                        setMessage('Please fill in both fields.', 'error');
                        return;
                    }
                    if (newPass.length < 8) {
                        setMessage('Password must be at least 8 characters.', 'error');
                        return;
                    }
                    if (newPass !== confirmPass) {
                        setMessage('Passwords do not match.', 'error');
                        return;
                    }
                    setLoading(this, true);
                    const { ok, data } = await apiCall('/api/reset-password', 'POST', {
                        token: resetTokenParam,
                        password: newPass
                    });
                    setLoading(this, false);
                    if (ok) {
                        setMessage('Password reset successfully! You can now login.', 'success');
                        document.getElementById('resetPasswordForm').remove();
                        window.history.replaceState({}, document.title, window.location.pathname);
                        switchTab('login');
                    } else {
                        setMessage(data.error || 'Reset failed.', 'error');
                    }
                });

                document.getElementById('cancelResetPasswordBtn').addEventListener('click', function() {
                    document.getElementById('resetPasswordForm').remove();
                    window.history.replaceState({}, document.title, window.location.pathname);
                });
            }

            // ─── If already logged in, redirect to dashboard ───
            if (getToken()) {
                window.location.href = REDIRECT_URL;
            }

        })();
    </script>

</body>
</html>
